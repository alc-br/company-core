name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras --group=dev

      - name: Check formatting (ruff format)
        run: uv run ruff format --check apps/ company_core/

      - name: Check linting (ruff check)
        run: uv run ruff check apps/ company_core/

      - name: Type check (mypy)
        run: uv run mypy apps/ || true

      - name: Check for secrets
        run: |
          echo "Checking for potential secrets..."
          ! git grep -n "github_pat_" || (echo "ERROR: GitHub PAT found!" && exit 1)
          ! git grep -n "GITHUB_TOKEN=" .env || true
          ! git grep -rn "sk-[a-zA-Z0-9]" --include="*.py" || true
          ! git grep -rn "AKIA[0-9A-Z]{16}" --include="*.py" || true
          echo "Secret check passed."

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test_company_core
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras --group=dev

      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_company_core
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "False"
        run: uv run python manage.py migrate --noinput

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_company_core
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "False"
        run: uv run pytest --cov=apps --cov-report=term-missing --cov-report=xml:coverage.xml -v --tb=short

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras --group=dev

      - name: Security check (pip-audit)
        run: uv run pip install pip-audit && pip-audit || true

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets..."
          patterns="github_pat_|sk-[a-zA-Z0-9]{20}|AKIA[0-9A-Z]{16}|PRIVATE_KEY|password\s*=\s*['\"][^'\"]+['\"]"
          for pattern in $patterns; do
            if rg -n "$pattern" apps/ company_core/ --include="*.py" 2>/dev/null; then
              echo "WARNING: Potential secret pattern found: $pattern"
            fi
          done
          echo "Security scan complete."

  validate-migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test_company_core
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras --group=dev

      - name: Check for missing migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_company_core
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "False"
        run: uv run python manage.py makemigrations --check --dry-run || true

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_company_core
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "False"
        run: uv run python manage.py migrate --noinput
