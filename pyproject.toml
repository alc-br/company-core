[project]
name = "company-core"
version = "0.1.0"
description = "Company Core - Plataforma SaaS multi-tenant construída sobre SaaS Pegasus"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Company Core Team", email = "team@companycore.dev"},
]

dependencies = [
    # Django Core
    "django>=5.1,<7.0",
    "django-environ>=0.12",
    "django-extensions>=3.2",
    "psycopg[binary]>=3.2",


    # Authentication (Pegasus - allauth)
    "django-allauth[socialaccount,openid]>=65.0",
    "django-cors-headers>=4.4",

    # API (Pegasus - DRF)
    "djangorestframework>=3.15",
    "drf-spectacular[sidecar]>=0.28",

    # Celery
    "celery[redis]>=5.4",
    "redis>=5.0",
    "django-celery-beat>=2.7",
    "celery-progress>=0.2",  # May need pip install from source

    # Feature Flags (Pegasus - Waffle)
    "django-waffle>=4.2",

    # Storage
    "django-storages[s3]>=1.14",
    "boto3>=1.35",

    # Billing - Stripe
    "stripe>=11.0",
    # dj-stripe>=2.8,  # Uncomment when Stripe is fully configured

    # AI Providers
    "openai>=1.50",
    "anthropic>=0.39",
    "google-generativeai>=0.8",

    # Notifications
    # django-anymail>=12.0,  # Uncomment when email providers are configured

    # Search
    "whoosh>=2.7",

    # Utilities
    "python-dateutil>=2.9",
    "pydantic>=2.9",
    "cryptography>=43.0",
    "httpx>=0.27",
    "Pillow>=10.4",

    # Health Checks
    # Health Checks - Use custom views instead of django-health-check
    # pip install django-health-check  # Uncomment to install

    # Task Queue Management
    "django-celery-results>=2.5",

    # API Versioning
    # drf-nested-routers>=0.94,  # Uncomment if nested routing is needed
]

[dependency-groups]
dev = [
    # Linting & Formatting
    "ruff>=0.7",
    "pre-commit>=4.0",

    # Type Checking
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs>=3.15",
    "types-redis>=4.6",
    "types-requests>=2.32",
    "types-python-dateutil>=2.9",
    "types-Pillow>=10.2",

    # Testing
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "factory-boy>=3.3",
    "responses>=0.25",
    "freezegun>=1.5",

    # Debugging
    "django-debug-toolbar>=4.4",
    "ipdb>=0.13",
    "werkzeug[watchdog]>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["company_core", "apps"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "DJ",   # flake8-django
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B904",  # raise without from inside except
    "DJ008", # do not use __all__ in models.py
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "company_core"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["N806", "N803"]
"*/tests/*" = ["S101", "S106", "S201"]
"settings*.py" = ["F403", "F405"]

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "allauth.*",
    "celery.*",
    "dj_stripe.*",
    "django_celery_beat.*",
    "django_waffle.*",
    "waffle.*",
    "storages.*",
    "stripe.*",
    "openai.*",
    "anthropic.*",
    "google.generativeai.*",
    "anymail.*",
    "haystack.*",
    "whoosh.*",
    "health_check.*",
    "factory.*",
    "freezegun.*",
    "responses.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "company_core.settings.base"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "company_core.settings.test"
python_files = ["test_*.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=apps",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=90",
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "unit: marks unit tests",
]
testpaths = ["apps"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/admin.py",
    "*/apps.py",
    "*/management/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __str__",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "pass",
]
