{% extends "base.html" %}
{% block title %}Confirmar Exclusão{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="breadcrumbs text-sm mb-4">
        <ul>
            <li><a href="{{ cancel_url }}">Listagem</a></li>
            <li class="active">Excluir</li>
        </ul>
    </div>

    <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
            <h2 class="card-title text-2xl">Confirmar Exclusão</h2>
            <p>Tem certeza que deseja excluir <strong>{{ object }}</strong>?</p>

            <form method="post">
                {% csrf_token %}
                <div class="card-actions justify-end mt-4">
                    <a href="{{ cancel_url }}" class="btn btn-ghost">Cancelar</a>
                    <button type="submit" class="btn btn-error">Excluir</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
